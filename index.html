<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex" />
<title>Joining server…</title>
<style>
  :root{
    --bg:#16130f; --panel:#1f1b16; --line:#3a332b;
    --amber:#f4a623; --burnt:#d2552a; --ink:#cdbfa8; --dim:#8c8270; --paper:#e7dccb;
    --mono:Consolas,"Courier New",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:var(--sans);color:var(--ink);
    background:radial-gradient(120% 90% at 50% -10%,#241e17,transparent 60%),var(--bg);
    display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:460px;background:linear-gradient(180deg,var(--panel),#16130f);
    border:1px solid var(--line);border-radius:4px;padding:30px 28px 26px;position:relative;overflow:hidden;
    box-shadow:0 28px 70px -30px #000}
  .stripe{position:absolute;top:0;left:0;right:0;height:6px;
    background:repeating-linear-gradient(135deg,var(--amber) 0 13px,#161310 13px 26px)}
  .kick{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--amber);margin:6px 0 4px;font-weight:700}
  h1{font-size:26px;margin:0 0 4px;color:var(--paper);font-weight:800;letter-spacing:.01em}
  .sub{color:var(--dim);font-size:13.5px;margin:0 0 18px}
  .addr{font-family:var(--mono);font-size:15px;color:#f0c98a;background:#0d0b08;border:1px solid #2a241c;
    border-radius:4px;padding:10px 12px;word-break:break-all;margin:0 0 18px}
  .spin{display:inline-block;width:15px;height:15px;border:2px solid #5a4f3f;border-top-color:var(--amber);
    border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:8px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .check{display:inline-block;color:#3fbf6b;font-weight:900;margin-right:8px;animation:pop .25s ease-out}
  @keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;border:none;cursor:pointer;
    background:#2f7d46;color:#fff;font-family:var(--sans);font-weight:700;font-size:16px;padding:13px;border-radius:4px;
    transition:background .12s}
  .btn:hover{background:#256b3a}
  .btn:active{transform:translateY(1px)}
  .row{display:flex;gap:8px;margin-top:9px}
  .ghost{flex:1;text-align:center;background:#2a2620;color:var(--ink);border:1px solid var(--line);
    border-radius:4px;padding:9px;font-size:13px;cursor:pointer;font-family:var(--sans)}
  .ghost:hover{background:#332e26}
  .hint{color:var(--dim);font-size:12px;margin:16px 0 0;line-height:1.5}
  .err{color:var(--burnt);font-weight:700}
  .copyfield{display:none;margin-top:10px}
  .copyfield code{display:block;font-family:var(--mono);font-size:12px;color:#c9ccd1;background:#0d0b08;
    border:1px solid #2a241c;border-radius:4px;padding:8px 10px;word-break:break-all}
</style>
</head>
<body>
  <main class="card">
    <span class="stripe"></span>
    <div class="kick">TF2 Lobby</div>
    <h1 id="title"><span class="spin"></span>Launching Steam…</h1>
    <p class="sub" id="sub">Handing you off to the game. If Steam doesn't ask to connect, use the button below.</p>
    <div class="addr" id="addr">—</div>
    <a class="btn" id="join" href="#">Join server</a>
    <div class="row">
      <button class="ghost" id="copybtn" type="button">Copy connect command</button>
    </div>
    <div class="copyfield" id="copyfield"><code id="concmd"></code></div>
    <p class="hint" id="hint">Your browser may ask "Open Steam?" — that's expected. Nothing is sent to any server: the connect details live only in this link, in your browser.</p>
  </main>

<script>
(function(){
  // Connect details are read from the URL FRAGMENT (#...), which browsers never
  // send to the server — so nothing sensitive is logged here. Formats accepted:
  //   #host:port            -> steam://connect/host:port            (e.g. SourceTV)
  //   #host:port/password   -> steam://connect/host:port/password
  // Each segment is URL-encoded by the bot; we decode defensively.
  function fail(msg){
    document.getElementById('title').textContent = 'Nothing to join';
    document.getElementById('sub').innerHTML = '<span class="err">'+msg+'</span>';
    document.getElementById('addr').textContent = '—';
    document.getElementById('join').style.display='none';
    document.querySelector('.row').style.display='none';
    document.getElementById('hint').style.display='none';
  }
  var raw = (location.hash || '').replace(/^#/, '');
  if(!raw){ fail('This link has no server address.'); return; }

  // First "/" splits endpoint from the (optional) password.
  var slash = raw.indexOf('/');
  var endpointRaw = slash === -1 ? raw : raw.slice(0, slash);
  var pwRaw       = slash === -1 ? '' : raw.slice(slash + 1);

  var endpoint, pw;
  try { endpoint = decodeURIComponent(endpointRaw); pw = pwRaw ? decodeURIComponent(pwRaw) : ''; }
  catch(e){ fail('This link is malformed.'); return; }

  // Validate host:port shape (hostname/IPv4 + 1-5 digit port). Defensive only —
  // a bad value would just make Steam fail to connect, but we'd rather say so.
  if(!/^[A-Za-z0-9.\-]{1,253}:\d{1,5}$/.test(endpoint)){ fail('That server address looks invalid.'); return; }

  var steam = 'steam://connect/' + endpoint + (pw ? '/' + pw : '');
  var human = 'connect ' + endpoint + (pw ? '; password ' + pw : '');

  document.getElementById('addr').textContent = endpoint + (pw ? '  (password set)' : '');
  document.getElementById('join').setAttribute('href', steam);
  document.getElementById('concmd').textContent = human;

  function go(){ window.location.href = steam; }

  // A web page gets NO success callback from the OS steam:// handler. The one
  // reliable signal that the handoff actually took is the browser losing focus /
  // the tab going hidden as Steam comes to the foreground — so treat that as
  // success and swap the spinner for a green check. It's a heuristic, not a
  // guarantee (the Join/copy fallbacks stay), but it's the standard "opened in
  // app" cue. Listeners are armed before the auto-attempt; once fired we latch.
  var launched = false;
  function markLaunched(){
    if(launched) return;
    launched = true;
    document.getElementById('title').innerHTML = '<span class="check">✓</span>Steam launched';
    document.getElementById('sub').textContent = 'Connecting you to the server — you can close this tab.';
  }
  document.addEventListener('visibilitychange', function(){ if(document.hidden) markLaunched(); });
  window.addEventListener('blur', markLaunched);
  window.addEventListener('pagehide', markLaunched);

  // Auto-attempt the steam:// handoff once on load. The visible Join button is the
  // fallback AND the retry — clicking it just re-fires the same link — for browsers
  // that require a direct click for protocol handlers.
  setTimeout(go, 350);
  document.getElementById('join').addEventListener('click', function(){ /* href does it */ });

  // Copy is MANUAL only — on the button click (a clear user gesture). We deliberately
  // do NOT auto-copy on load: an unsolicited clipboard write pops a "clipboard
  // permission" prompt in some browsers (it broke the page in Brave), which looks
  // alarming on a page whose only job is to launch the game. The click also reveals
  // the command, so it stays selectable even where the clipboard write is blocked.
  document.getElementById('copybtn').addEventListener('click', function(){
    document.getElementById('copyfield').style.display = 'block';
    try{ navigator.clipboard.writeText(human); this.textContent = 'Copied ✓'; }
    catch(e){ this.textContent = 'Select & copy ↓'; }
  });
})();
</script>
</body>
</html>
